# Project Pythagoras — API (documentation-grade manifests).
# Same service shape as docker-compose.yml: one image, uvicorn
# entrypoint, REDIS_URL broker, ./storage and ./models as volumes.
# Build/push the image from the repo Dockerfile before applying;
# "project-pythagora:latest" is a placeholder registry reference.
#
# replicas is deliberately 1: track analyses and the job registry live
# in per-process memory in v1 (backend/store.py, backend/jobs.py), so
# horizontal replicas would not share state. Scale only after that
# state moves to Redis/Postgres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pythagoras-api
  labels:
    app.kubernetes.io/name: pythagoras
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pythagoras
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pythagoras
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: project-pythagoras:latest
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: PYTHAGORA_STORAGE_DIR
              value: storage
          volumeMounts:
            - name: storage
              mountPath: /app/storage
            - name: models
              mountPath: /app/models
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: pythagoras-storage
        - name: models
          persistentVolumeClaim:
            claimName: pythagoras-models
---
apiVersion: v1
kind: Service
metadata:
  name: pythagoras-api
  labels:
    app.kubernetes.io/name: pythagoras
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: pythagoras
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
