<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Pythagoras — Deep Musicology</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="bg-glow" aria-hidden="true"></div>

    <header id="topbar">
      <div class="brand">
        <div class="brand-mark">π</div>
        <div class="brand-text">
          <span class="brand-name">PYTHAGORAS</span>
          <span class="brand-sub">deep musicology engine</span>
        </div>
      </div>
      <nav class="topnav">
        <button class="nav-link active" data-nav="library">Library</button>
        <button class="nav-link" data-nav="detail-demo">Now Playing</button>
      </nav>
      <button id="upload-btn" class="cta-btn">Upload</button>
      <div id="api-status" class="api-status" title="Backend connection">
        <span class="dot"></span><span class="label">connecting…</span>
      </div>
    </header>

    <main id="app">
      <!-- Library view -->
      <section id="view-library" class="view">
        <div id="billboard"></div>

        <div id="carousels"></div>
      </section>

      <!-- Track detail view -->
      <section id="view-detail" class="view hidden">
        <button id="back-btn" class="ghost-btn">← Library</button>
        <div id="detail-content"></div>
      </section>

      <div id="toast" class="toast hidden"></div>

      <!-- Upload modal -->
      <div id="upload-modal" class="modal hidden">
        <div class="modal-card">
          <h2>Upload a track</h2>
          <p class="panel-sub">Audio goes straight into the analysis pipeline — tempo, key, chords, sections, waveform.</p>
          <label>Title<input id="up-title" type="text" placeholder="Track title" /></label>
          <label>Artist<input id="up-artist" type="text" placeholder="Artist" /></label>
          <label>Audio file<input id="up-audio" type="file" accept=".mp3,.wav,.ogg,.flac,.m4a,.aac" /></label>
          <label>Cover art (optional)<input id="up-artwork" type="file" accept=".jpg,.jpeg,.png,.webp" /></label>
          <div class="modal-actions">
            <button id="up-cancel" class="ghost-btn">Cancel</button>
            <button id="up-submit" class="cta-btn">Upload &amp; analyze</button>
          </div>
        </div>
      </div>

      <!-- Job progress -->
      <div id="job-panel" class="job-panel hidden">
        <button id="job-close" class="ghost-btn" aria-label="Dismiss">×</button>
        <div class="job-info"><b id="job-title">Analyzing…</b><span id="job-stage">Queued</span></div>
        <div class="job-bar"><div id="job-fill"></div></div>
      </div>
    </main>

    <footer id="footer">
      <span>Project Pythagoras · deterministic musicology</span>
      <span id="footer-mode">demo telemetry</span>
    </footer>

    <script>window.PYTHAGORAS_API_BASE = window.PYTHAGORAS_API_BASE || 'http://127.0.0.1:8000';</script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
